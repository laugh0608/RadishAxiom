name: 语义或协议提案
description: 提议语言语义、Axiom IR、验证状态或 Axiom Evidence 的长期变化。
title: "[Proposal] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 说明当前表达中的歧义、错误空间或验证缺口，不要先从语法偏好出发。
    validations:
      required: true
  - type: textarea
    id: goals
    attributes:
      label: 目标与非目标
      description: 分别列出本提案必须解决和明确不解决的内容。
    validations:
      required: true
  - type: textarea
    id: semantics
    attributes:
      label: 语义与规范化方案
      description: 说明类型、效果、契约、IR 映射、验证义务和唯一规范形式。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence 与信任边界
      description: 说明状态、假设、trusted 边界、反例和独立检查器影响。
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: 正例、负例与反例
      description: 提供能区分本方案与替代方案的最小例子。
      render: text
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: 兼容性与迁移
      description: 说明版本、已有程序、IR/Evidence 消费者和失败模式。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 列出考虑过的方案、取舍和暂不采用的原因。
    validations:
      required: true
